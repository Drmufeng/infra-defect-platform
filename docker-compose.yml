services:
  postgres:
    image: postgres:16-alpine
    container_name: infra-defect-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infra_defect_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-231223}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: infra-defect-api
    depends_on:
      - postgres
    command: >-
      /bin/sh -c "python -m app.db.init_db && uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-2048}"
    environment:
      APP_HOST: ${API_HOST:-0.0.0.0}
      APP_PORT: ${API_PORT:-2048}
      ROOT_PATH: ${API_ROOT_PATH:-}
      DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:5180,http://127.0.0.1:5180}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-231223}
      DATABASE_NAME: ${POSTGRES_DB:-infra_defect_platform}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-1234}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-infra-defect-platform-dev-secret}
    ports:
      - "${API_PORT:-2048}:${API_PORT:-2048}"
    volumes:
      - ./storage:/workspace/storage
      - ./datasets:/workspace/datasets
      - ./training:/workspace/training

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_VITE_API_BASE_URL:-/api}
    container_name: infra-defect-admin-web
    ports:
      - "${ADMIN_PORT:-5500}:80"
    depends_on:
      - api-server

  client-web:
    build:
      context: .
      dockerfile: apps/client-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${CLIENT_VITE_API_BASE_URL:-/api}
    container_name: infra-defect-client-web
    ports:
      - "${CLIENT_PORT:-5180}:80"
    depends_on:
      - api-server

volumes:
  postgres_data:
